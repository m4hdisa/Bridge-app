appId: app.bridge.client
productName: Bridge
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/core
    to: core
  - from: resources/xray
    to: xray
  - from: resources/aether
    to: aether
  - from: resources/rules
    to: rules
  - from: resources/perapp
    to: perapp
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - nsis
  icon: resources/icon.png
  # Starts without admin; the app asks to restart as admin only for TUN / Per-App modes.
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # The optional Per-App driver page (see build/installer.nsh).
  include: build/installer.nsh
  shortcutName: Bridge
  # What updates download (latest.yml points here); people install with "Bridge Setup <version>.exe",
  # Bridge's own window around this installer (scripts/build-setup.mjs).
  artifactName: Bridge-Update-${version}.${ext}
